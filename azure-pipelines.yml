# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

#steps:
#- script: echo Hello, world!
#  displayName: 'Run a one-line script'

#- script: |
#    echo Add other tasks to build, test, and deploy your project.
#    echo See https://aka.ms/yaml
#  displayName: 'Run a multi-line script'

stages:
- stage: 'Build'
  jobs: 
    - job: 'Build'
      steps:
        - script: echo Build
        - task: ServiceNow-DevOps-Agent-Artifact-Registration@1
          inputs:
            connectedServiceName: 'dev207018-favian-devops-ServiceNow DevOps Service Connection'
            artifactsPayload: |
              {
                  "artifacts": [
                    {
                        "name": "favian-devops.war",
                        "version": "2.$(Build.BuildId).0",
                        "repositoryName": "favian-DevOps"
                    }
                  ]
              }

- stage: 'Test'
  jobs: 
    - job: 'Unit_Tests'
      steps:
        - script: echo Unit Tests
    - job: 'Checkmarx_scan'
      steps:
        - script: echo Checkmarx scan

- stage: 'Deploy'
  jobs: 
    - job: 'UAT_Deploy'
      steps:
        - script: echo UAT Deploy
    - job: 'Production_Deploy'
      steps:
        - script: echo Production Deploy
        - task: ServiceNow-DevOps-Agent-Package-Registration@1
          inputs:
            connectedServiceName: 'dev207018-favian-devops-ServiceNow DevOps Service Connection'
            packageName: "Package - $(Build.BuildId)"
            artifactsPayload: |
              {
                  "artifacts": [
                  {
                      "name": "favian-devops.war",
                      "repositoryName": "favian-DevOps",
                      "version": "2.$(build.buildId).0",
                      "currentBuildInfo": "true"
                  }]
              }
  